<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercise 8 - Form đặt vé máy bay</title>
    <!-- Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <style>
      .form-container {
        max-width: 500px;
        margin: 30px auto;
        border: 1px solid #ddd;
        background-color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="form-container rounded shadow-sm overflow-hidden">
      <!-- 1. Alert (Top Banner) -->
      <div
        class="alert alert-warning alert-dismissible fade show m-0 rounded-0"
        role="alert"
      >
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>

      <div class="p-4">
        <!-- 2. Main Title <h1> -->
        <h1 class="fw-bold mb-4">Form đặt vé máy bay</h1>

        <form>
          <!-- 3. Form-group 1: Họ tên (Input Group with prepend & append) -->
          <div class="mb-3">
            <label for="fullName" class="form-label text-secondary"
              >Họ tên</label
            >
            <div class="input-group">
              <span class="input-group-text bg-white text-secondary"
                ><i class="bi bi-person"></i
              ></span>
              <input
                type="text"
                class="form-control"
                id="fullName"
                placeholder="Họ tên"
              />
              <span class="input-group-text bg-light text-secondary">vnđ</span>
            </div>
            <div class="form-text text-muted">
              Phải nhập 5 ký tự, in hoa....
            </div>
          </div>

          <!-- 4. Form-group 2: Địa chỉ -->
          <div class="mb-3">
            <label for="address" class="form-label text-secondary"
              >Địa chỉ</label
            >
            <input type="text" class="form-control" id="address" />
            <div class="form-text text-muted">
              Phải nhập 5 ký tự, in hoa....
            </div>
          </div>

          <!-- 5. Form-group 3 & 4: Đi từ & Đến (2 columns) -->
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="fromLoc" class="form-label text-secondary"
                >Đi từ</label
              >
              <select class="form-select" id="fromLoc">
                <option selected>Hà nội</option>
                <option value="1">Đà Nẵng</option>
                <option value="2">TP. Hồ Chí Minh</option>
              </select>
            </div>
            <div class="col-6">
              <label for="toLoc" class="form-label text-secondary">Đến</label>
              <select class="form-select" id="toLoc">
                <option selected>Hà nội</option>
                <option value="1">Đà Nẵng</option>
                <option value="2">TP. Hồ Chí Minh</option>
              </select>
            </div>
          </div>

          <!-- 6. Form-group 5: Chọn chiều đi (Khứ hồi) -->
          <div class="mb-4">
            <label class="form-label text-secondary"
              >Chọn chiều đi (Khứ hồi)</label
            >
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="checkDi" />
              <label class="form-check-label text-secondary" for="checkDi"
                >Đi</label
              >
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="checkVe" />
              <label class="form-check-label text-secondary" for="checkVe"
                >Về</label
              >
            </div>
          </div>

          <!-- 7. Submit Button -->
          <input
            type="submit"
            class="btn btn-primary w-100 py-2 fw-bold"
            value="Đặt vé"
          />
        </form>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
