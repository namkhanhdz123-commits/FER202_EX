<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FPT University Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .header-bg {
        background-color: #e68a2e;
      }
      .footer-bg {
        background-color: #f5cc84;
      }
    </style>
  </head>
  <body>
    <!-- Top Header Block -->
    <header class="header-bg text-center py-4">
      <div class="container">
        <div class="bg-white p-3 d-inline-block rounded mb-3">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/1/11/FPT_logo_2010.svg"
            alt="FPT Education"
            class="img-fluid"
            style="max-height: 100px"
          />
          <h2 class="text-danger fw-bold mt-2">FPT UNIVERSITY</h2>
        </div>
        <nav class="d-flex justify-content-center gap-3 text-white">
          <a href="#" class="text-white text-decoration-none">Home</a>
          <a href="#" class="text-white text-decoration-none">About</a>
          <a href="#" class="text-white text-decoration-none">Contact</a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container text-center my-5">
      <section class="mb-5">
        <h2 class="fw-bold">About</h2>
        <p class="text-muted">This is the about section of the website.</p>
      </section>

      <section class="mb-5">
        <h2 class="fw-bold">Contact</h2>
        <p class="text-muted">
          For any inquiries, please contact us at
          <a href="mailto:example@example.com">example@example.com</a>.
        </p>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer-bg text-center py-3 text-white">
      <p class="m-0">&copy; 2023 Website. All rights reserved.</p>
    </footer>
  </body>
</html>
