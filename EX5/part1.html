<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grid System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .grid-box {
        background-color: #d3d3d3;
        border: 1px solid #777;
        padding: 15px;
        min-height: 80px;
      }
    </style>
  </head>
  <body>
    <!-- Header Jumbotron Section -->
    <div class="bg-light p-5 rounded-3 mb-4">
      <div class="container-fluid py-3">
        <h1 class="display-5 fw-bold">Let's test the grid!</h1>
      </div>
    </div>

    <!-- Grid Rows Section -->
    <div class="container my-4">
      <!-- Row 1: 2 Columns -->
      <div class="row g-0">
        <div class="col-6 grid-box">First col</div>
        <div class="col-6 grid-box">Second col</div>
      </div>
      <!-- Row 2: 3 Columns -->
      <div class="row g-0">
        <div class="col-4 grid-box">col</div>
        <div class="col-4 grid-box">col</div>
        <div class="col-4 grid-box">col</div>
      </div>
      <!-- Row 3: 4 Columns -->
      <div class="row g-0">
        <div class="col-3 grid-box">col</div>
        <div class="col-3 grid-box">col</div>
        <div class="col-3 grid-box">col</div>
        <div class="col-3 grid-box">col</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-secondary-subtle text-center py-3 mt-5">
      <h2>Created by ABC!</h2>
    </footer>
  </body>
</html>
